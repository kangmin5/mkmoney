name: mkmoney-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mkmoney_test
      POSTGRES_USER: mkmoney_test
      POSTGRES_PASSWORD: mkmoney_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkmoney_test -d mkmoney_test"]
      interval: 2s
      timeout: 2s
      retries: 15
