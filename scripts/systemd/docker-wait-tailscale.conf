# docker.service 드롭인: tailscaled 뒤에 기동하고 Tailscale IPv4가 붙을 때까지 최대 30초 기다린다.
# 이유: compose 프록시가 TAILNET_BIND_IP:8443에 바인드하므로, IP가 없을 때 docker가 먼저 뜨면
#       프록시가 시작에 실패하고 LAN 접속까지 끊긴다.
# 설치: sudo install -Dm644 scripts/systemd/docker-wait-tailscale.conf \
#         /etc/systemd/system/docker.service.d/wait-tailscale.conf && sudo systemctl daemon-reload
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
# 앞의 '-': 30초 안에 IP가 안 붙어도 docker 기동 자체는 막지 않는다(다른 컨테이너 보호).
ExecStartPre=-/bin/sh -c 'for i in $$(seq 1 30); do ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q " 100\\." && exit 0; sleep 1; done; echo "tailscale0 IPv4 대기 시간 초과" >&2; exit 1'
